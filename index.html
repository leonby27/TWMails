<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Список писем — Timeweb</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: #E8EBF0;
      color: #1b364a;
    }

    /* ───── Сайдбар ───── */
    .sidebar {
      width: 300px;
      min-width: 300px;
      height: 100vh;
      background: #ffffff;
      border-right: 1px solid #E3E8F0;
      overflow-y: auto;
      padding: 28px 20px;
    }
    .sidebar__head { padding: 0 12px 20px; }
    .sidebar__title { margin: 0; font-size: 20px; font-weight: 700; line-height: 26px; color: #1b364a; }

    .nav { display: flex; flex-direction: column; gap: 6px; }
    .nav-item {
      display: block;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background .12s, border-color .12s;
    }
    .nav-item:hover { background: #F4F7FB; }
    .nav-item.active { background: #EBF6FF; border-color: #CFE3F8; }

    .nav-item__date {
      display: block;
      font-size: 13px;
      font-weight: 400;
      color: #8e9bb0;
      margin-bottom: 3px;
    }
    .nav-item.active .nav-item__date { color: #2784CE; }

    /* одна строка максимум + обрезка в «…» */
    .nav-item__title {
      display: block;
      font-size: 17px;
      font-weight: 700;
      line-height: 22px;
      color: #1b364a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .nav-item.active .nav-item__title { color: #2784CE; }

    /* ───── Просмотр письма ───── */
    .viewer { flex: 1; height: 100vh; background: #E8EBF0; }
    .viewer iframe { width: 100%; height: 100%; border: 0; display: block; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar__head">
      <h1 class="sidebar__title">Список писем</h1>
    </div>
    <nav class="nav" id="nav">
      <a class="nav-item active" data-src="letter-1.html">
        <span class="nav-item__date">27 мая 2026</span>
        <span class="nav-item__title">Хороший старт!</span>
      </a>
      <a class="nav-item" data-src="letter-3.html">
        <span class="nav-item__date">29 мая 2026</span>
        <span class="nav-item__title">Запускаем ваш сайт вместе</span>
      </a>
      <a class="nav-item" data-src="letter-4.html">
        <span class="nav-item__date">2 июня 2026</span>
        <span class="nav-item__title">Пара слов лично от меня</span>
      </a>
      <a class="nav-item" data-src="letter-5.html">
        <span class="nav-item__date">9 июня 2026</span>
        <span class="nav-item__title">Давайте посчитаем выгоду?</span>
      </a>
      <a class="nav-item" data-src="letter-6.html">
        <span class="nav-item__date">18 июня 2026</span>
        <span class="nav-item__title">Любите промокоды?</span>
      </a>
    </nav>
  </aside>

  <main class="viewer">
    <iframe id="frame" src="letter-1.html" title="Просмотр письма"></iframe>
  </main>

  <script>
    (function () {
      var nav = document.getElementById('nav');
      var frame = document.getElementById('frame');
      nav.addEventListener('click', function (e) {
        var item = e.target.closest('.nav-item');
        if (!item) return;
        e.preventDefault();
        Array.prototype.forEach.call(nav.querySelectorAll('.nav-item'), function (n) {
          n.classList.remove('active');
        });
        item.classList.add('active');
        frame.src = item.getAttribute('data-src');
      });
    })();
  </script>
</body>
</html>
