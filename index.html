<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Список писем — Timeweb</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: #E8EBF0;
      color: #1b364a;
    }

    .topbar { display: none; }
    .burger { width: 26px; height: 20px; position: relative; background: none; border: 0; padding: 0; cursor: pointer; flex: 0 0 auto; }
    .burger span { position: absolute; left: 0; right: 0; height: 2px; background: #1b364a; border-radius: 2px; }
    .burger span:nth-child(1) { top: 0; }
    .burger span:nth-child(2) { top: 9px; }
    .burger span:nth-child(3) { top: 18px; }
    .overlay { display: none; }

    .sidebar {
      width: 300px;
      min-width: 300px;
      height: 100vh;
      background: #ffffff;
      border-right: 1px solid #E3E8F0;
      overflow-y: auto;
      padding: 28px 20px;
    }
    .sidebar__head { padding: 0 12px 16px; }
    .sidebar__title { margin: 0; font-size: 20px; font-weight: 700; line-height: 26px; color: #1b364a; }

    .nav { display: flex; flex-direction: column; gap: 6px; }
    .nav-group {
      font-size: 12px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
      color: #aab3c5; padding: 16px 16px 4px;
    }
    .nav-group:first-child { padding-top: 2px; }

    .nav-item {
      display: block;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background .12s, border-color .12s;
    }
    .nav-item:hover { background: #F4F7FB; }
    .nav-item.active { background: #EBF6FF; border-color: #CFE3F8; }

    .nav-item__date { display: block; font-size: 13px; font-weight: 400; color: #8e9bb0; margin-bottom: 3px; }
    .nav-item.active .nav-item__date { color: #2784CE; }

    .nav-item__title {
      display: block;
      font-size: 17px;
      font-weight: 700;
      line-height: 22px;
      color: #1b364a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .nav-item.active .nav-item__title { color: #2784CE; }

    .viewer { flex: 1; height: 100vh; background: #E8EBF0; }
    .viewer iframe { width: 100%; height: 100%; border: 0; display: block; }

    @media (max-width: 768px) {
      .topbar {
        display: flex; align-items: center; gap: 14px;
        position: fixed; top: 0; left: 0; right: 0; height: 56px;
        padding: 0 18px; background: #ffffff; border-bottom: 1px solid #E3E8F0; z-index: 30;
      }
      .topbar__title { font-size: 17px; font-weight: 700; color: #1b364a; }

      .sidebar {
        position: fixed; top: 0; left: 0; bottom: 0;
        width: 280px; min-width: 280px; height: 100vh;
        transform: translateX(-100%); transition: transform .25s ease;
        z-index: 40; box-shadow: 0 0 40px rgba(15, 32, 58, .18);
      }
      body.nav-open .sidebar { transform: translateX(0); }

      .overlay { position: fixed; inset: 0; background: rgba(15, 32, 58, .45); z-index: 35; }
      body:not(.nav-open) .overlay { display: none; }
      body.nav-open .overlay { display: block; }

      .viewer { width: 100%; padding-top: 56px; }
      .viewer iframe { height: calc(100vh - 56px); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <button class="burger" id="burger" aria-label="Открыть меню" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <span class="topbar__title">Список писем</span>
  </header>

  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar__head">
      <h1 class="sidebar__title">Список писем</h1>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-group">Возврат на годовой</div>
      <a class="nav-item active" data-src="letter-winback.html">
        <span class="nav-item__date">27 мая 2026</span>
        <span class="nav-item__title">Экономия до 35%</span>
      </a>

      <div class="nav-group">Велком-цепочка</div>
      <a class="nav-item" data-src="letter-1.html">
        <span class="nav-item__date">27 мая 2026</span>
        <span class="nav-item__title">Хороший старт!</span>
      </a>
      <a class="nav-item" data-src="letter-3.html">
        <span class="nav-item__date">27 мая 2026</span>
        <span class="nav-item__title">Запускаем ваш сайт вместе</span>
      </a>
      <a class="nav-item" data-src="letter-4.html">
        <span class="nav-item__date">27 мая 2026</span>
        <span class="nav-item__title">Пара слов лично от меня</span>
      </a>
      <a class="nav-item" data-src="letter-5.html">
        <span class="nav-item__date">27 мая 2026</span>
        <span class="nav-item__title">Давайте посчитаем выгоду?</span>
      </a>
      <a class="nav-item" data-src="letter-6.html">
        <span class="nav-item__date">27 мая 2026</span>
        <span class="nav-item__title">Любите промокоды?</span>
      </a>
    </nav>
  </aside>

  <main class="viewer">
    <iframe id="frame" src="letter-winback.html" title="Просмотр письма"></iframe>
  </main>

  <script>
    (function () {
      var nav = document.getElementById('nav');
      var frame = document.getElementById('frame');
      var burger = document.getElementById('burger');
      var overlay = document.getElementById('overlay');

      function closeMenu() {
        document.body.classList.remove('nav-open');
        burger.setAttribute('aria-expanded', 'false');
      }
      function toggleMenu() {
        var open = document.body.classList.toggle('nav-open');
        burger.setAttribute('aria-expanded', open ? 'true' : 'false');
      }

      burger.addEventListener('click', toggleMenu);
      overlay.addEventListener('click', closeMenu);

      nav.addEventListener('click', function (e) {
        var item = e.target.closest('.nav-item');
        if (!item) return;
        e.preventDefault();
        Array.prototype.forEach.call(nav.querySelectorAll('.nav-item'), function (n) {
          n.classList.remove('active');
        });
        item.classList.add('active');
        frame.src = item.getAttribute('data-src');
        closeMenu();
      });
    })();
  </script>
</body>
</html>
